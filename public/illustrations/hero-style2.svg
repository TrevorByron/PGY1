<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" aria-hidden="true">
  <!-- Notion-style: simple shapes, single accent color -->
  <g fill="currentColor" style="color: var(--accent, #15803d)">
    <!-- Document / form -->
    <rect x="120" y="60" width="160" height="180" rx="8" fill="currentColor" opacity="0.15"/>
    <rect x="140" y="85" width="120" height="8" rx="4" opacity="0.4"/>
    <rect x="140" y="105" width="100" height="8" rx="4" opacity="0.4"/>
    <rect x="140" y="125" width="110" height="8" rx="4" opacity="0.4"/>
    <rect x="140" y="155" width="80" height="40" rx="6" opacity="0.5"/>
    <!-- Check / security -->
    <circle cx="200" cy="200" r="36" stroke="currentColor" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M188 200l8 8 16-16" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Decorative dots -->
    <circle cx="280" cy="80" r="12" opacity="0.2"/>
    <circle cx="320" cy="140" r="8" opacity="0.15"/>
    <circle cx="80" cy="160" r="10" opacity="0.15"/>
  </g>
</svg>
